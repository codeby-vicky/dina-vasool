spring.application.name=dina-vasool-backend

# NOTE: your PostgreSQL 18 instance may run on a different port than 5432
# (you have both PostgreSQL 17 and 18 installed - check pgAdmin > right-click
# "PostgreSQL 18" > Properties > Connection tab > Port, and change below if needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/DailyVasool
spring.datasource.username=postgres
spring.datasource.password=Vignesh@2004

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# JWT config - CHANGE this secret before deploying to production
app.jwt.secret=ChangeThisToARandomLongSecretKeyOfAtLeast256BitsForHS256Signing
app.jwt.expiration-ms=86400000
